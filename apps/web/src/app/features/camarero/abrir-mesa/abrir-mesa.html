<mp-topbar
  titulo="mi_plancha · Camarero"
  [empresaNombre]="sesion.empresaNombre() ?? ''"
  [empresaCodigo]="sesion.usuario()?.empresaId ?? ''"
  [nombre]="sesion.usuario()?.nombre ?? ''"
  (cerrarSesion)="cerrarSesion()"
/>

<main class="abrir-mesa">
  <form class="form-card" (ngSubmit)="abrir()" #f="ngForm">
    <h2>Abrir mesa</h2>

    <label>
      Mesa
      <select name="mesaId" [(ngModel)]="mesaId" required>
        <option value="" disabled>Elige una mesa libre</option>
        @for (mesa of mesasLibres(); track mesa.id) {
          <option [value]="mesa.id">Mesa {{ mesa.numero }}</option>
        }
      </select>
      @if (mesasLibres().length === 0) {
        <span class="ayuda">No hay mesas libres ahora mismo.</span>
      }
    </label>

    <label>
      Nombre del cliente
      <input type="text" name="nombre" [(ngModel)]="nombre" required />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <div class="acciones">
      <a routerLink="/camarero" class="btn secundario">Cancelar</a>
      <button type="submit" [disabled]="f.invalid || guardando()">
        {{ guardando() ? 'Abriendo…' : 'Abrir mesa' }}
      </button>
    </div>
  </form>
</main>
