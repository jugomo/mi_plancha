@if (cargando()) {
  <p class="cargando">Cargando…</p>
} @else {
  <form class="form-card" (ngSubmit)="guardar()" #f="ngForm">
    <h2>Plancha</h2>

    <label>
      Capacidad total
      <input type="number" name="capacidadTotal" [(ngModel)]="capacidadTotal" required min="1" step="1" />
      <span class="ayuda">Suma máxima de capacidad de productos que pueden cocinarse a la vez.</span>
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    @if (guardado()) {
      <p class="ok" role="status">Guardado.</p>
    }

    <button type="submit" [disabled]="f.invalid || guardando()">
      {{ guardando() ? 'Guardando…' : 'Guardar' }}
    </button>
  </form>
}
