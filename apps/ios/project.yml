name: MiPlancha
options:
  bundleIdPrefix: com.jugomo
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  MiPlancha:
    type: application
    platform: iOS
    sources:
      - path: MiPlancha
        excludes:
          - "GoogleService-Info.plist"
          - "Assets.xcassets/**"
    resources:
      - path: MiPlancha/GoogleService-Info.plist
      - path: MiPlancha/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jugomo.miplancha
        PRODUCT_NAME: MiPlancha
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: mi_plancha
