<main class="login">
  <form class="login-card" (ngSubmit)="enviar()" #f="ngForm">
    <h1>mi_plancha</h1>
    <p class="subtitulo">Inicia sesión</p>

    <div class="pestanas" role="tablist">
      <button type="button" role="tab" [class.activa]="pestana() === 'empresa'" (click)="cambiarPestana('empresa')">
        Empresa
      </button>
      <button
        type="button"
        role="tab"
        [class.activa]="pestana() === 'administracion'"
        (click)="cambiarPestana('administracion')"
      >
        Administración
      </button>
    </div>

    @if (pestana() === 'empresa') {
      <label>
        Empresa
        <input type="text" name="codigoEmpresa" [(ngModel)]="codigoEmpresa" required autocomplete="off" />
      </label>

      <label>
        Usuario
        <input type="text" name="username" [(ngModel)]="username" required autocomplete="username" />
      </label>
    } @else {
      <label>
        Email
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
      </label>
    }

    <label>
      Contraseña
      <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn-enviar" [disabled]="f.invalid || enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
