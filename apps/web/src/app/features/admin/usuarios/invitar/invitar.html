<form class="form-card" (ngSubmit)="guardar()" #f="ngForm">
  <h2>Invitar usuario</h2>

  <label>
    Nombre
    <input type="text" name="nombre" [(ngModel)]="nombre" required />
  </label>

  <label>
    Email
    <input type="email" name="email" [(ngModel)]="email" required autocomplete="off" />
  </label>

  <label>
    Contraseña inicial
    <input type="text" name="password" [(ngModel)]="password" required minlength="6" autocomplete="off" />
    <span class="ayuda">Compártesela tú directamente — todavía no hay forma de que la cambien ellos mismos.</span>
  </label>

  <label>
    Rol
    <select name="rol" [(ngModel)]="rol" required>
      <option value="camarero">Camarero</option>
      <option value="cocinero">Cocinero</option>
      <option value="administrador">Administrador</option>
    </select>
  </label>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <div class="acciones">
    <a routerLink="/admin/usuarios" class="btn secundario">Cancelar</a>
    <button type="submit" [disabled]="f.invalid || guardando()">
      {{ guardando() ? 'Creando…' : 'Crear' }}
    </button>
  </div>
</form>
