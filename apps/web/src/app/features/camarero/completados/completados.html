<mp-topbar
  titulo="mi_plancha · Camarero"
  [empresaNombre]="sesion.empresaNombre() ?? ''"
  [empresaCodigo]="sesion.usuario()?.empresaId ?? ''"
  [nombre]="sesion.usuario()?.nombre ?? ''"
  (cerrarSesion)="cerrarSesion()"
/>

<main class="completados">
  <a routerLink="/camarero" class="volver">← Mesas</a>
  <h2>Pedidos completados</h2>

  @if(error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <div class="lista">
    @for (pedido of pedidos(); track pedido.id) {
      <div class="pedido-card">
        <a [routerLink]="['/camarero/pedidos', pedido.id]" class="info">
          <div>
            <span class="id">Mesa {{ pedido.mesaNumero }} · {{ pedido.clienteNombre }}</span>
            <span class="hora">Pedido de las {{ horaCreacion(pedido) }}</span>
          </div>
          <span class="ver">✓ Entregado</span>
        </a>
        @if (pedido.cuentaId) {
              <button type="button" class="borrar" (click)="borrarPedido(pedido)" 
                      [disabled]="borrando() === pedido.id">
                {{borrando() === pedido.id ? "Borrando..." : "Borrar"}}
              </button>
        }
      </div>  
    } @empty {
      <p class="vacio">Todavía no tienes pedidos completados.</p>
    }
  </div>
</main>
